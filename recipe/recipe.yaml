# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 4.0.0

package:
  name: python-dateutil
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-dateutil/python_dateutil-${{ version }}.tar.gz
  sha256: d7295ff14fdc0f92f662100bfb6c551d160ca090f2939f1ec5b9794265c03f06

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - hatch-vcs >=0.4
    - hatch-fancy-pypi-readme >=24.1
    - pip
  run:
    - python >=${{ python_min }}
    - tzdata
tests:
  - python:
      imports:
        - dateutil
        - dateutil.parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      file: run_test.py

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Extensions to the standard Python datetime module.
  description: |
    The dateutil module provides powerful extensions to the standard datetime
    module, available in Python.
  homepage: https://dateutil.readthedocs.org/
  repository: https://github.com/dateutil/dateutil/
  documentation: https://dateutil.readthedocs.org/en/latest/

extra:
  recipe-maintainers:
    - pganssle
    - msarahan
    - ocefpaf
    - thewchan
